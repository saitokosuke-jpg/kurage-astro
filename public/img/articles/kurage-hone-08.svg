<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a1e"/>
      <stop offset="50%" stop-color="#0d2a30"/>
      <stop offset="100%" stop-color="#081820"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#4a7c8a" stop-opacity=".2"/>
      <stop offset="60%" stop-color="#4a7c8a" stop-opacity=".05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="jelly" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#4a7c8a" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#4a7c8a" stop-opacity=".05"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg4)"/>
  <rect width="1200" height="750" fill="url(#glow4)"/>
  <!-- Marine snow particles -->
  <circle cx="100" cy="200" r="2" fill="#e8dcc8" opacity=".12"/>
  <circle cx="250" cy="350" r="1.5" fill="#e8dcc8" opacity=".08"/>
  <circle cx="400" cy="180" r="1" fill="#e8dcc8" opacity=".1"/>
  <circle cx="550" cy="420" r="2" fill="#e8dcc8" opacity=".06"/>
  <circle cx="700" cy="150" r="1.5" fill="#e8dcc8" opacity=".1"/>
  <circle cx="850" cy="380" r="1" fill="#e8dcc8" opacity=".08"/>
  <circle cx="1000" cy="250" r="2" fill="#e8dcc8" opacity=".1"/>
  <circle cx="150" cy="500" r="1" fill="#e8dcc8" opacity=".06"/>
  <circle cx="900" cy="550" r="1.5" fill="#e8dcc8" opacity=".08"/>
  <circle cx="350" cy="600" r="1" fill="#e8dcc8" opacity=".05"/>
  <circle cx="650" cy="650" r="2" fill="#e8dcc8" opacity=".06"/>
  <circle cx="1100" cy="450" r="1" fill="#e8dcc8" opacity=".07"/>
  <!-- Jellyfish silhouette -->
  <ellipse cx="300" cy="280" rx="80" ry="50" fill="url(#jelly)"/>
  <path d="M240 310 Q250 400 235 450" fill="none" stroke="#4a7c8a" stroke-width="1.5" opacity=".12"/>
  <path d="M270 320 Q275 420 260 480" fill="none" stroke="#4a7c8a" stroke-width="1" opacity=".1"/>
  <path d="M300 325 Q300 430 295 500" fill="none" stroke="#4a7c8a" stroke-width="1.5" opacity=".12"/>
  <path d="M330 320 Q328 410 340 470" fill="none" stroke="#4a7c8a" stroke-width="1" opacity=".1"/>
  <path d="M355 310 Q350 390 365 440" fill="none" stroke="#4a7c8a" stroke-width="1.5" opacity=".12"/>
  <!-- Small jellyfish -->
  <ellipse cx="950" cy="180" rx="30" ry="18" fill="#4a7c8a" opacity=".08"/>
  <path d="M930 192 Q932 230 928 250" fill="none" stroke="#4a7c8a" stroke-width="1" opacity=".06"/>
  <path d="M950 195 Q950 235 948 260" fill="none" stroke="#4a7c8a" stroke-width="1" opacity=".06"/>
  <path d="M968 192 Q966 225 972 245" fill="none" stroke="#4a7c8a" stroke-width="1" opacity=".06"/>
  <!-- Series badge -->
  <rect x="480" y="240" width="240" height="28" rx="14" fill="#4a7c8a" opacity=".15"/>
  <text x="600" y="260" font-family="sans-serif" font-size="13" fill="#4a7c8a" text-anchor="middle" letter-spacing=".1em">連載 第8話</text>
  <!-- Text -->
  <text x="600" y="320" font-family="serif" font-size="22" fill="#4a7c8a" opacity=".7" text-anchor="middle" letter-spacing=".15em">ESSAY</text>
  <text x="600" y="400" font-family="serif" font-size="56" fill="#e8dcc8" text-anchor="middle" font-weight="700">深海に降る雪のように</text>
  <text x="600" y="470" font-family="serif" font-size="20" fill="#6b8a8a" text-anchor="middle">クラゲには骨がない ── 第8話</text>
  <text x="600" y="570" font-family="sans-serif" font-size="16" fill="#5a8a8a" text-anchor="middle" letter-spacing=".1em">齊藤 光祐</text>
</svg>
